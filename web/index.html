<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banquet Hall Survey</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:640px;margin:24px auto;padding:0 16px;background:#faf8f5;color:#222}
  input,select,textarea,button{width:100%;padding:10px;margin:6px 0;box-sizing:border-box;font-size:15px}
  button{background:#8b1e3f;color:#fff;border:0;border-radius:6px;cursor:pointer}
  .card{background:#fff;border:1px solid #e5ded5;border-radius:8px;padding:16px;margin:12px 0}
  table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #eee;text-align:left}
  .hide{display:none}a{color:#8b1e3f;cursor:pointer}
</style>
</head>
<body>
<h2>Grand Banquet Hall - Opening Survey</h2>

<div id="auth" class="card">
  <div id="signin">
    <h3>Sign in</h3>
    <input id="lemail" type="email" placeholder="Email">
    <input id="lpass" type="password" placeholder="Password">
    <button onclick="login()">Sign in</button>
    <p>New here? <a onclick="show('signup')">Create account</a></p>
  </div>
  <div id="signup" class="hide">
    <h3>Register</h3>
    <input id="sname" placeholder="Full name">
    <input id="semail" type="email" placeholder="Email">
    <input id="sphone" placeholder="Phone e.g. +919876543210">
    <input id="spass" type="password" placeholder="Password (8+ chars, upper, lower, number)">
    <button onclick="signup()">Register</button>
    <p><a onclick="show('signin')">Back to sign in</a></p>
  </div>
  <div id="confirm" class="hide">
    <h3>Verify email</h3>
    <input id="ccode" placeholder="Code sent to your email">
    <button onclick="confirmUser()">Verify</button>
  </div>
</div>

<div id="app" class="hide">
  <p id="hello"></p>
  <div class="card"><h3>Plans, tariff &amp; facilities</h3><div id="info"></div></div>
  <div class="card">
    <h3>Tell us what you need</h3>
    <select id="event_type"><option value="">Event type</option><option>Wedding</option><option>Reception</option>
      <option>Engagement</option><option>Birthday</option><option>Corporate</option><option>Other</option></select>
    <input id="expected_guests" type="number" placeholder="Expected guests">
    <select id="budget_range"><option value="">Budget</option><option>Below 1 lakh</option><option>1-3 lakh</option>
      <option>3-6 lakh</option><option>Above 6 lakh</option></select>
    <input id="preferred_month" placeholder="Preferred month">
    <select id="preferred_plan"><option value="">Preferred plan</option><option>Silver</option><option>Gold</option><option>Platinum</option></select>
    <textarea id="comments" rows="3" placeholder="Suggestions / comments"></textarea>
    <button onclick="submitSurvey()">Submit survey</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
<script src="config.js"></script>
<script>
const C = window.CONFIG, $ = id => document.getElementById(id);
const pool = new AmazonCognitoIdentity.CognitoUserPool({UserPoolId: C.poolId, ClientId: C.clientId});
let token = null, pendingEmail = null;

function show(id){ ["signin","signup","confirm"].forEach(x => $(x).classList.toggle("hide", x !== id)); }
const attr = (n, v) => new AmazonCognitoIdentity.CognitoUserAttribute({Name: n, Value: v});

function signup(){
  pendingEmail = $("semail").value.trim();
  pool.signUp(pendingEmail, $("spass").value,
    [attr("email", pendingEmail), attr("name", $("sname").value), attr("phone_number", $("sphone").value)], null,
    err => err ? alert(err.message) : show("confirm"));
}
function confirmUser(){
  new AmazonCognitoIdentity.CognitoUser({Username: pendingEmail, Pool: pool})
    .confirmRegistration($("ccode").value, true, err => err ? alert(err.message) : (alert("Verified. Please sign in."), show("signin")));
}
function login(){
  const email = $("lemail").value.trim();
  const user = new AmazonCognitoIdentity.CognitoUser({Username: email, Pool: pool});
  user.authenticateUser(new AmazonCognitoIdentity.AuthenticationDetails({Username: email, Password: $("lpass").value}), {
    onSuccess: r => { token = r.getIdToken().getJwtToken(); start(); },
    onFailure: e => alert(e.message)
  });
}
async function api(path, method="GET", body){
  const r = await fetch(C.api + path, {method, headers: {Authorization: token, "Content-Type": "application/json"},
    body: body ? JSON.stringify(body) : undefined});
  const j = await r.json(); if(!r.ok) throw new Error(j.error || j.message || r.status); return j;
}
async function start(){
  try{
    const info = await api("/info"), me = await api("/me");
    $("auth").classList.add("hide"); $("app").classList.remove("hide");
    $("hello").textContent = "Welcome, " + (me.name || me.email);
    $("info").innerHTML = "<table><tr><th>Plan</th><th>Capacity</th><th>Per plate</th><th>Hall rent</th></tr>" +
      info.plans.map(p => `<tr><td>${p.name}</td><td>${p.capacity}</td><td>₹${p.price_per_plate}</td><td>₹${p.hall_rent}</td></tr>`).join("") +
      "</table><p><b>Facilities:</b> " + info.facilities.join(", ") + "</p>";
  }catch(e){ alert(e.message); }
}
async function submitSurvey(){
  const b = {}; ["event_type","expected_guests","budget_range","preferred_month","preferred_plan","comments"].forEach(k => b[k] = $(k).value);
  try{ alert((await api("/survey","POST",b)).message); }catch(e){ alert(e.message); }
}
</script>
</body>
</html>
